name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Prepare public website files
        run: |
          mkdir -p _site
          cp index.html styles.css script.js robots.txt sitemap.xml _site/
          cp -R assets _site/assets

      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
